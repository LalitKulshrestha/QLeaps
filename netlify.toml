[build]
  publish = "dist"
  command = "node scripts/build.cjs"

[build.environment]
  NODE_VERSION = "22"

# Canonical URL normalization: enforce clean URLs without index.html
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/index.html"
  to = "/blogs/"
  status = 301
  force = true

[[redirects]]
  from = "/careers/index.html"
  to = "/careers/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/index.html"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/how-we-work/index.html"
  to = "/how-we-work/"
  status = 301
  force = true

[[redirects]]
  from = "/roles/index.html"
  to = "/roles/"
  status = 301
  force = true

[[redirects]]
  from = "/specialisms/index.html"
  to = "/specialisms/"
  status = 301
  force = true

[[redirects]]
  from = "/submit-cv/index.html"
  to = "/submit-cv/"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/:slug/index.html"
  to = "/blogs/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://script.google.com https://script.googleusercontent.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com;"

# Cache static assets
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
